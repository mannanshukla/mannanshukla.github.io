  <style>
    /* spawnpoint's dark theme (getspawnpoint.com): the #171717 canvas, the
       pink tile flock behind a black glass card, Geist for text, Stack Sans
       Headline for the name, a white primary pill and glass secondary pills. */
    :root {
      color-scheme: dark;
      --canvas: #171717;
      --foreground: #ffffff;
      --muted: #a1a3a6;
      --accent: #ef285e;
      --font-ui: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      --font-headline: "Stack Sans Headline", "Geist", ui-sans-serif, system-ui, sans-serif;
      --ring: color-mix(in srgb, #fff 10%, transparent);
      --glass: color-mix(in srgb, #fff 7%, transparent);
      --glass-hover: color-mix(in srgb, #fff 12%, transparent);
      --glass-edge: inset 0 1px 0 color-mix(in srgb, #fff 16%, transparent), 0 0 0 1px color-mix(in srgb, #fff 9%, transparent);
    }
    * { box-sizing: border-box; }
    html { background: var(--canvas); }
    body {
      min-height: 100dvh;
      margin: 0;
      padding: 48px 16px;
      display: grid;
      place-items: center;
      background: var(--canvas);
      color: var(--foreground);
      font-family: var(--font-ui);
      font-size: 15px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    /* The flock, fixed behind everything; brand/flock.js draws it. */
    .stage {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: var(--canvas);
    }
    .stage canvas { display: block; width: 100%; height: 100%; }
    .stage::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(ellipse 70% 60% at 50% 50%, color-mix(in srgb, #000 35%, transparent), transparent 70%);
    }

    main {
      position: relative;
      z-index: 1;
      width: min(100%, 560px);
      padding: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      border-radius: 17px;
      background: color-mix(in srgb, #000 68%, transparent);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: inset 0 1px 0 color-mix(in srgb, #fff 14%, transparent), 0 0 0 1px var(--ring), 0 3px 10px 0.5px #0000000b, 0 12px 40px 2px #00000010;
    }
    .photo {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 11px;
      box-shadow: 0 0 0 1px var(--ring);
    }
    h1 {
      margin: 28px 0 12px;
      font-family: var(--font-headline);
      font-weight: 500;
      font-size: clamp(38px, 9vw, 56px);
      line-height: 1;
      letter-spacing: -0.025em;
    }
    .lead {
      margin: 0;
      color: var(--muted);
      font-size: 18px;
      line-height: 26px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      height: 36px;
      padding: 0 16px;
      border-radius: 999px;
      color: var(--foreground);
      font-size: 14px;
      font-weight: 500;
      line-height: 1;
      text-decoration: none;
      white-space: nowrap;
      transition: background-color .15s ease, box-shadow .15s ease;
    }
    .btn:focus-visible { outline: 2px solid color-mix(in srgb, #fff 50%, transparent); outline-offset: 2px; }
    .btn-primary {
      height: 44px;
      padding: 0 22px;
      color: #000;
      background: #fff;
      font-size: 15px;
    }
    .btn-primary:hover { box-shadow: 0 2px 8px #0000004d; }
    .btn-ghost {
      background: var(--glass);
      backdrop-filter: blur(14px) saturate(1.3);
      -webkit-backdrop-filter: blur(14px) saturate(1.3);
      box-shadow: var(--glass-edge);
    }
    .btn-ghost:hover { background: var(--glass-hover); }
    .btn svg { flex: none; width: 15px; height: 15px; fill: currentColor; }
    .btn .mark { width: auto; height: 13px; margin-bottom: 1px; }

    .cta { margin-top: 28px; }
    .links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-top: 16px;
    }
    .email { margin: 24px 0 0; font-size: 14px; }
    .email a {
      color: var(--muted);
      text-decoration: underline;
      text-decoration-color: color-mix(in srgb, var(--accent) 70%, transparent);
      text-underline-offset: 3px;
    }
    .email a:hover { color: var(--accent); }

    @media (max-width: 560px) {
      body { padding: 24px 16px; }
      main { padding: 24px; }
      h1 { margin-top: 24px; }
      .lead { font-size: 16px; line-height: 24px; }
      .cta, .cta .btn { width: 100%; }
      .links { display: grid; grid-template-columns: 1fr 1fr; width: 100%; }
    }
  </style>
</head>
