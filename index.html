  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@600&display=swap" rel="stylesheet">
  <style>
    /* The iOS 4 era apple.com, circa 2010: a soft gray page with a white
       spotlight, a white card with a drop shadow, Myriad headline over
       Lucida Grande text, the photo as an iPhoto print, a
       glossy blue pill for the main link, the graphite global nav bar for
       the links, and #0088cc links. */
    :root {
      color-scheme: light;
      --text: #333;
      --muted: #666;
      --link: #0088cc;
      --font-ui: "Lucida Grande", "Lucida Sans Unicode", "Helvetica Neue", Helvetica, Arial, Verdana, sans-serif;
      --font-headline: "Myriad Set Pro", "Myriad Pro", "Source Sans 3", "Lucida Grande", "Helvetica Neue", Helvetica, Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    html { background: #dcdcdc; }
    body {
      min-height: 100dvh;
      margin: 0;
      padding: 48px 16px;
      display: grid;
      place-items: center;
      align-content: center;
      gap: 20px;
      background:
        radial-gradient(ellipse 55% 45% at 50% 42%, #fff, rgba(255, 255, 255, 0) 100%),
        linear-gradient(#f2f2f2, #d6d6d6);
      color: var(--text);
      font-family: var(--font-ui);
      font-size: 12px;
      line-height: 18px;
    }

    main {
      width: min(100%, 560px);
      padding: 40px 40px 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      border-radius: 8px;
      background: linear-gradient(#fff 70%, #f6f6f6);
      box-shadow:
        0 0 0 1px rgba(0, 0, 0, .1),
        0 1px 2px rgba(0, 0, 0, .15),
        0 10px 30px rgba(0, 0, 0, .12);
    }

    /* The photo as an iPhoto print: a white border, a hairline edge, a soft
       shadow where it lies on the page, and set down a little crooked. */
    .shot {
      width: 100%;
      margin: 0;
      padding: 8px;
      transform: rotate(-1.5deg);
      outline: 1px solid transparent; /* smooths the rotated edges in Firefox */
      background: #fff;
      box-shadow:
        0 0 0 1px rgba(0, 0, 0, .1),
        0 1px 3px rgba(0, 0, 0, .25),
        0 6px 16px rgba(0, 0, 0, .14);
    }
    .photo {
      display: block;
      width: 100%;
      height: auto;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, .08);
    }

    h1 {
      margin: 30px 0 10px;
      font-family: var(--font-headline);
      font-weight: 600;
      font-size: clamp(36px, 8vw, 48px);
      line-height: 1.05;
      letter-spacing: -.01em;
      color: #333;
      text-shadow: 0 1px 0 #fff;
    }
    .lead {
      margin: 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 24px;
      text-shadow: 0 1px 0 #fff;
    }

    /* iOS 4 gloss: a lighter top half that breaks hard at the middle. */
    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      height: 40px;
      padding: 0 20px 0 7px;
      border: 1px solid #1a5fb4;
      border-radius: 20px;
      background: linear-gradient(#84c2ff, #439ff5 49%, #1f80e6 51%, #2b8df0);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, .6),
        inset 0 -1px 0 rgba(255, 255, 255, .15),
        0 1px 2px rgba(0, 0, 0, .3);
      color: #fff;
      font-size: 15px;
      font-weight: bold;
      line-height: 1;
      text-decoration: none;
      text-shadow: 0 -1px 0 rgba(0, 0, 0, .35);
      white-space: nowrap;
    }
    .btn-primary:hover { background: linear-gradient(#94cbff, #55a9f7 49%, #2c8aec 51%, #3897f3); }
    .btn-primary:active {
      background: linear-gradient(#2a7fd6, #1a6cc4 49%, #145fb2 51%, #1b6bc0);
      box-shadow: inset 0 1px 3px rgba(0, 0, 0, .4), 0 1px 0 rgba(255, 255, 255, .6);
    }
    .btn-primary:focus-visible { outline: 3px solid rgba(0, 136, 204, .45); outline-offset: 2px; }

    /* spawnpoint as an iOS 4 home screen icon: dark tile, pink mark, gloss arc,
       and iOS 4's corner (10px on a 57px icon). */
    .app-icon {
      position: relative;
      display: grid;
      place-items: center;
      flex: none;
      width: 26px;
      height: 26px;
      overflow: hidden;
      border-radius: 4.5px;
      background: linear-gradient(#2e2e2e, #121212);
      box-shadow: 0 1px 1px rgba(0, 0, 0, .45), inset 0 0 0 1px rgba(255, 255, 255, .08);
    }
    .app-icon::after {
      content: "";
      position: absolute;
      top: -62%;
      left: -30%;
      width: 160%;
      height: 112%;
      border-radius: 50%;
      background: linear-gradient(rgba(255, 255, 255, .45), rgba(255, 255, 255, .1));
    }
    .app-icon svg { position: relative; width: 18px; height: auto; }

    .cta { margin-top: 28px; }

    /* The links ride the graphite global nav bar from the top of apple.com:
       text only, equal segments, etched dividers. */
    .links {
      display: flex;
      width: 100%;
      margin-top: 24px;
      overflow: hidden;
      border: 1px solid #3a3a3a;
      border-radius: 5px;
      background: linear-gradient(#8a8a8a, #6b6b6b 48%, #565656 52%, #414141);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .3), 0 1px 2px rgba(0, 0, 0, .3);
    }
    .links a {
      flex: 1 1 0;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 36px;
      padding: 0 6px;
      color: #fff;
      font-size: 13px;
      text-decoration: none;
      text-shadow: 0 -1px 0 rgba(0, 0, 0, .6);
      white-space: nowrap;
    }
    .links a + a {
      border-left: 1px solid #333;
      box-shadow: inset 1px 0 0 rgba(255, 255, 255, .16);
    }
    .links a:hover { background: linear-gradient(#6e6e6e, #4f4f4f 48%, #3d3d3d 52%, #2c2c2c); }
    .links a:active {
      background: linear-gradient(#2f2f2f, #1f1f1f);
      box-shadow: inset 0 1px 4px rgba(0, 0, 0, .6);
    }
    .links a:focus-visible { outline: 2px solid #7fc4ff; outline-offset: -3px; }

    .email { margin: 22px 0 0; }
    .email a { color: var(--link); text-decoration: none; text-shadow: 0 1px 0 #fff; }
    .email a:hover { text-decoration: underline; }

    /* apple.com's small print under the page. */
    .sosumi {
      margin: 0;
      color: #808080;
      font-size: 11px;
      line-height: 14px;
      text-align: center;
      text-shadow: 0 1px 0 rgba(255, 255, 255, .8);
    }

    @media (max-width: 560px) {
      body { padding: 24px 16px; }
      main { padding: 24px 20px 24px; }
      .shot { padding: 6px; }
      h1 { margin-top: 24px; }
      .lead { font-size: 14px; line-height: 22px; }
      .cta, .cta .btn-primary { width: 100%; }
      .links a { font-size: 12px; padding: 0 2px; }
    }
  </style>
</head>
