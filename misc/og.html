<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>og source: Mannan Shukla</title>
  <!-- Source for /og.png. Render: see misc/og.sh. Same 2010 apple.com look
       as index.html: the white card on the gray spotlight, the photo as a
       tilted iPhoto print, Myriad (or Source Sans 3) over Lucida Grande, and
       the glossy blue spawnpoint pill. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background:
        radial-gradient(ellipse 60% 55% at 50% 45%, #fff, rgba(255, 255, 255, 0) 100%),
        linear-gradient(#f2f2f2, #d6d6d6);
      color: #333;
      font-family: "Lucida Grande", "Lucida Sans Unicode", "Helvetica Neue", Helvetica, Arial, sans-serif;
    }
    .card {
      position: absolute;
      inset: 44px;
      display: flex;
      align-items: center;
      gap: 56px;
      padding: 0 60px 0 56px;
      border-radius: 14px;
      background: linear-gradient(#fff 70%, #f6f6f6);
      box-shadow:
        0 0 0 1px rgba(0, 0, 0, .1),
        0 2px 4px rgba(0, 0, 0, .15),
        0 18px 50px rgba(0, 0, 0, .14);
    }
    .print {
      flex: none;
      width: 540px;
      padding: 12px;
      transform: rotate(-2deg);
      background: #fff;
      box-shadow:
        0 0 0 1px rgba(0, 0, 0, .1),
        0 2px 5px rgba(0, 0, 0, .25),
        0 12px 28px rgba(0, 0, 0, .16);
    }
    .print img {
      display: block;
      width: 100%;
      height: auto;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, .08);
    }
    h1 {
      margin: 0 0 16px;
      font-family: "Myriad Set Pro", "Myriad Pro", "Source Sans 3", "Lucida Grande", sans-serif;
      font-weight: 600;
      font-size: 82px;
      line-height: .96;
      letter-spacing: -.01em;
      text-shadow: 0 1px 0 #fff;
    }
    .lead {
      margin: 0;
      color: #666;
      font-size: 28px;
      line-height: 1.3;
      text-shadow: 0 1px 0 #fff;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      height: 60px;
      margin-top: 36px;
      padding: 0 30px 0 10px;
      border: 1px solid #1a5fb4;
      border-radius: 30px;
      background: linear-gradient(#84c2ff, #439ff5 49%, #1f80e6 51%, #2b8df0);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, .6),
        inset 0 -1px 0 rgba(255, 255, 255, .15),
        0 2px 3px rgba(0, 0, 0, .3);
      color: #fff;
      font-size: 23px;
      font-weight: bold;
      text-shadow: 0 -1px 0 rgba(0, 0, 0, .35);
      white-space: nowrap;
    }
    .app-icon {
      position: relative;
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      overflow: hidden;
      border-radius: 7px;
      background: linear-gradient(#2e2e2e, #121212);
      box-shadow: 0 1px 2px rgba(0, 0, 0, .45), inset 0 0 0 1px rgba(255, 255, 255, .08);
    }
    .app-icon::after {
      content: "";
      position: absolute;
      top: -62%;
      left: -30%;
      width: 160%;
      height: 112%;
      border-radius: 50%;
      background: linear-gradient(rgba(255, 255, 255, .45), rgba(255, 255, 255, .1));
    }
    .app-icon svg { position: relative; width: 28px; height: auto; }
    .url {
      margin: 26px 0 0;
      color: #0088cc;
      font-size: 22px;
      text-shadow: 0 1px 0 #fff;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="print"><img src="../mannan5.jpg" alt="" width="1115" height="676"></div>
    <div>
      <h1>Mannan<br>Shukla</h1>
      <p class="lead">building the future</p>
      <div class="pill">
        <span class="app-icon"><svg viewBox="3.7 7.95 24.6 16.1" aria-hidden="true"><rect x="12.2" y="7.95" width="7.6" height="7.6" rx="1.4" fill="#ef285e"/><rect x="12.2" y="7.95" width="7.6" height="2.13" rx="1.4" fill="#ffd2de" opacity=".55"/><rect x="20.7" y="7.95" width="7.6" height="7.6" rx="1.4" fill="#ef285e"/><rect x="20.7" y="7.95" width="7.6" height="2.13" rx="1.4" fill="#ffd2de" opacity=".55"/><rect x="3.7" y="16.45" width="7.6" height="7.6" rx="1.4" fill="#ef285e"/><rect x="3.7" y="16.45" width="7.6" height="2.13" rx="1.4" fill="#ffd2de" opacity=".55"/><rect x="12.2" y="16.45" width="7.6" height="7.6" rx="1.4" fill="#ef285e"/><rect x="12.2" y="16.45" width="7.6" height="2.13" rx="1.4" fill="#ffd2de" opacity=".55"/></svg></span>
        check out spawnpoint
      </div>
      <p class="url">mannan.dev</p>
    </div>
  </div>
</body>
</html>
